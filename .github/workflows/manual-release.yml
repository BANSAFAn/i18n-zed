name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease / alpha"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust with wasm32-wasip2
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Update version numbers in manifests
        run: |
          VERSION="${{ inputs.version }}"
          # Cargo.toml
          sed -i 's/^version = ".*"/version = "'"$VERSION"'"/' Cargo.toml
          # extension.toml
          sed -i 's/^version = ".*"/version = "'"$VERSION"'"/' extension.toml
          # lsp/package.json
          npm --prefix lsp version "$VERSION" --no-git-tag-version

      - name: Build TypeScript LSP & CLI
        run: |
          cd lsp
          npm install
          npm run build
          cd ..

      - name: Build Rust WASM Extension
        run: |
          cargo build --target wasm32-wasip2 --release
          cp target/wasm32-wasip2/release/zed_i18n.wasm extension.wasm

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml extension.toml lsp/package.json extension.wasm
          git commit -m "chore: release v${{ inputs.version }}" || echo "No changes"
          git tag "v${{ inputs.version }}"
          git push origin main --tags

      # ─────────────────────────────────────────────────────────────
      # ООО ТУТ МОЯ РУКОЖОПІСТЬ БІЛЬШЕ, ЧИ ШІ СУЧАРСЬКИЙ
      # ─────────────────────────────────────────────────────────────
      - name: Create GitHub Release with Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRE_FLAG="--prerelease"
          fi
          gh release create "v${{ inputs.version }}" extension.wasm extension.toml \
            --title "v${{ inputs.version }}" \
            --generate-notes \
            $PRE_FLAG
